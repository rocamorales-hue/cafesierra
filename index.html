<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Sierra Escondida - Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografías modernas: Montserrat para títulos y marca, Inter para datos -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta de la marca */
    --brand-orange: #F3A022;
    --brand-orange-dark: #D98918;
    --brand-green: #0F6343;
    --brand-dark: #1C1C1C;
    
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #333333;
    --ink-soft: #666666;
    
    --line: #E2E8F0;
    --shadow: rgba(0, 0, 0, 0.05);
    
    /* Estados */
    --state-amber: #B45309;
    --state-amber-bg: #FEF3C7;
    --state-slate: #0F766E;
    --state-slate-bg: #CCFBF1;
    --state-sage: #15803D;
    --state-sage-bg: #DCFCE7;

    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --display: 'Montserrat', sans-serif;
  }
  
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }

  /* --- Header / Navegación Moderno --- */
  header {
    background: var(--surface);
    color: var(--ink);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1.5rem;
    box-shadow: 0 4px 20px var(--shadow);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .brand-container {
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }
  
  .logo {
    max-height: 65px;
    width: auto;
    object-fit: contain;
  }
  
  header h1 {
    font-family: var(--display);
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0;
    color: var(--brand-green);
    letter-spacing: -0.02em;
  }
  
  header p {
    margin: 0.15rem 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  
  nav { display: flex; gap: 0.5rem; }
  nav button {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  nav button:hover {
    background: var(--bg);
    color: var(--brand-green);
  }
  nav button.active {
    background: var(--brand-green);
    color: white;
  }

  /* --- Layout principal --- */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  .vista { display: none; animation: fadeIn 0.3s ease; }
  .vista.activa { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- Historial --- */
  .resumen {
    background: linear-gradient(135deg, var(--brand-green), #147a53);
    color: white;
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 1.05rem;
    box-shadow: 0 8px 16px rgba(15, 99, 67, 0.15);
    font-family: var(--display);
    font-weight: 500;
  }
  .resumen strong { color: var(--brand-orange); font-weight: 800; }
  
  .filtros {
    background: var(--surface);
    padding: 1.2rem;
    border-radius: 12px;
    box-shadow: 0 2px 12px var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
    align-items: end;
    border: 1px solid var(--line);
  }
  
  .campo { display: flex; flex-direction: column; gap: 0.4rem; }
  .campo label { font-size: 0.85rem; color: var(--ink-soft); font-weight: 600; }
  
  select, input[type=text], input[type=number], input[type=date] {
    font-family: var(--sans);
    font-size: 0.95rem;
    padding: 0.6rem 0.8rem;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    transition: all 0.2s;
  }
  select:focus, input:focus { 
    outline: none; 
    border-color: var(--brand-green); 
    box-shadow: 0 0 0 3px rgba(15, 99, 67, 0.15);
  }
  
  .btn {
    font-family: var(--sans);
    font-size: 0.95rem;
    padding: 0.65rem 1.2rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .btn-primario { background: var(--brand-orange); color: var(--brand-dark); }
  .btn-primario:hover { background: var(--brand-orange-dark); transform: translateY(-1px); }
  
  .btn-secundario { background: var(--bg); color: var(--ink); border: 1px solid #CBD5E1; }
  .btn-secundario:hover { background: #E2E8F0; }
  
  /* --- Tabla --- */
  .tabla-envoltura {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 4px 20px var(--shadow);
  }
  .tabla-envoltura::-webkit-scrollbar { height: 8px; }
  .tabla-envoltura::-webkit-scrollbar-track { background: var(--bg); }
  .tabla-envoltura::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; text-align: left; }
  thead th {
    padding: 1rem;
    background: #F8FAFC;
    color: var(--ink-soft);
    font-weight: 600;
    border-bottom: 2px solid var(--line);
    white-space: nowrap;
    font-family: var(--display);
  }
  tbody td {
    padding: 1rem;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tbody tr:hover td { background-color: #F8FAFC; }
  tbody tr:last-child td { border-bottom: none; }
  
  .num { font-family: var(--mono); font-weight: 500; color: var(--ink-soft); }
  
  /* Más espacio para la descripción */
  .col-desc { min-width: 280px; white-space: normal; line-height: 1.4; }

  /* --- Estados (Clickables) --- */
  .estado {
    display: inline-block;
    padding: 0.35rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: var(--sans);
    user-select: none;
  }
  
  /* Clase para animar los estados clickeables */
  .estado.interactivo { 
    cursor: pointer; 
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s; 
    border: 1px solid transparent;
  }
  .estado.interactivo:hover { 
    transform: scale(1.05); 
    opacity: 0.9; 
    box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
  }
  .estado.interactivo:active { transform: scale(0.95); }

  .fila-en-camino .estado.entrega { background: var(--state-amber-bg); color: var(--state-amber); border-color: #FDE68A; }
  .fila-entregado .estado.entrega { background: var(--state-slate-bg); color: var(--state-slate); border-color: #99F6E4; }
  
  .estado.pago-pendiente { background: var(--state-amber-bg); color: var(--state-amber); border-color: #FDE68A; }
  .estado.pago-pagado { background: var(--state-sage-bg); color: var(--state-sage); border-color: #BBF7D0; }
  
  .estado-vacio {
    padding: 4rem 1rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 1rem;
    font-weight: 500;
  }

  /* --- Formulario --- */
  .formulario-container {
    display: flex;
    justify-content: center;
  }
  .formulario {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 8px 30px var(--shadow);
  }
  .formulario h2 {
    font-family: var(--display);
    font-size: 1.6rem;
    margin: 0 0 1.5rem;
    color: var(--brand-green);
    border-bottom: 3px solid var(--brand-orange);
    padding-bottom: 0.5rem;
    display: inline-block;
  }
  .formulario .campo { margin-bottom: 1.2rem; width: 100%; }
  .formulario select, .formulario input { width: 100%; padding: 0.7rem 0.8rem; }
  
  .fila-doble { display: flex; gap: 1rem; }
  .fila-doble .campo { flex: 1; }
  
  .check { 
    display: flex; 
    align-items: center; 
    gap: 0.5rem; 
    margin: 1.5rem 0; 
    padding: 1rem;
    background: var(--bg);
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .check input { width: auto; transform: scale(1.3); accent-color: var(--brand-green); cursor: pointer; }
  .check label { font-size: 0.95rem; color: var(--ink); margin: 0; font-weight: 500; cursor: pointer; }
  
  .formulario .btn-primario { width: 100%; padding: 0.9rem; font-size: 1.05rem; }
  
  #mensaje-form { margin-top: 1.2rem; font-size: 0.95rem; text-align: center; font-weight: 600; }
  #mensaje-form.ok { color: var(--brand-green); }
  #mensaje-form.error { color: #DC2626; }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    header { flex-direction: column; align-items: flex-start; padding: 1rem 1.5rem; gap: 1rem; }
    .brand-container { margin-bottom: 0; }
    nav { width: 100%; overflow-x: auto; padding-bottom: 0.5rem; justify-content: space-between; }
    nav button { flex: 1; white-space: nowrap; text-align: center; }
    
    .filtros { flex-direction: column; align-items: stretch; }
    .filtros .campo { width: 100%; }
    
    .fila-doble { flex-direction: column; gap: 0; }
    .formulario { padding: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-container">
    <!-- Se mantiene el nombre exacto de tu archivo -->
    <img src="logo con colores sin fondo.jpg" alt="Café Sierra Escondida Logo" class="logo" onerror="this.style.display='none'">
    <div>
      <h1>Café Sierra Escondida</h1>
      <p>Lo mejor de México en tu taza</p>
    </div>
  </div>
  <nav>
    <button id="tab-historial" class="active">Historial</button>
    <button id="tab-formulario">Nuevo pedido</button>
  </nav>
</header>

<main>

  <!-- ===== HISTORIAL ===== -->
  <section id="vista-historial" class="vista activa">

    <div class="resumen" id="resumen">Cargando pedidos…</div>

    <div class="filtros">
      <div class="campo">
        <label for="f-region">Región</label>
        <select id="f-region">
          <option value="">Todas</option>
          <option value="CHIAPAS">Chiapas</option>
          <option value="VERACRUZ">Veracruz</option>
          <!-- Nueva región Oaxaca agregada -->
          <option value="OAXACA">Oaxaca</option>
        </select>
      </div>
      <div class="campo">
        <label for="f-entrega">Entrega</label>
        <select id="f-entrega">
          <option value="">Todos</option>
          <option value="PENDIENTE">En camino</option>
          <option value="ENTREGADO">Entregado</option>
        </select>
      </div>
      <div class="campo">
        <label for="f-pago">Pago</label>
        <select id="f-pago">
          <option value="">Todos</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="PAGADO">Pagado</option>
        </select>
      </div>
      <div class="campo" style="flex:1; min-width:200px;">
        <label for="f-buscar">Buscar</label>
        <input type="text" id="f-buscar" placeholder="Folio, guía, descripción…">
      </div>
      <button class="btn btn-secundario" id="btn-refrescar">Actualizar</button>
    </div>

    <div class="tabla-envoltura">
      <table>
        <thead>
          <tr>
            <th>Folio</th>
            <th>Región</th>
            <th>Guía / paquetería</th>
            <th class="col-desc">Descripción</th>
            <th>Kg</th>
            <th>Monto</th>
            <th>Entrega</th>
            <th>Pago</th>
            <th>Fecha pago</th>
          </tr>
        </thead>
        <tbody id="tabla-body"></tbody>
      </table>
      <div class="estado-vacio" id="estado-vacio" style="display:none;">No hay pedidos que coincidan con estos filtros.</div>
    </div>
  </section>

  <!-- ===== FORMULARIO ===== -->
  <section id="vista-formulario" class="vista">
    <div class="formulario-container">
      <form class="formulario" id="form-pedido">
        <h2>Registrar nuevo pedido</h2>

        <div class="campo">
          <label for="f-in-region">Región</label>
          <select id="f-in-region" required>
            <option value="CHIAPAS">Chiapas</option>
            <option value="VERACRUZ">Veracruz</option>
            <!-- Nueva región Oaxaca agregada -->
            <option value="OAXACA">Oaxaca</option>
            <option value="OTRA">Otra</option>
          </select>
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label for="f-in-cantidad">Cantidad (kg)</label>
            <input type="number" id="f-in-cantidad" step="0.1" min="0" required>
          </div>
          <div class="campo">
            <label for="f-in-monto">Monto ($)</label>
            <input type="number" id="f-in-monto" step="0.01" min="0" required>
          </div>
        </div>

        <div class="campo">
          <label for="f-in-descripcion">Descripción</label>
          <input type="text" id="f-in-descripcion" placeholder="ej. MEZCLA ESP, MOLIDO KG">
        </div>

        <div class="fila-doble">
          <div class="campo">
            <label for="f-in-guia">Número de guía (opcional)</label>
            <input type="text" id="f-in-guia">
          </div>
          <div class="campo">
            <label for="f-in-paqueteria">Paquetería</label>
            <select id="f-in-paqueteria">
              <option value="">—</option>
              <option value="PAQUETE EXPRESS">Paquete Express</option>
              <option value="CORREOS MEXICO">Correos México</option>
              <option value="ESTAFETA">Estafeta</option>
            </select>
          </div>
        </div>

        <div class="check">
          <input type="checkbox" id="f-in-cargo">
          <label for="f-in-cargo">Es un cargo de envío, no un pedido de café</label>
        </div>

        <button type="submit" class="btn btn-primario">Guardar pedido</button>
        <div id="mensaje-form"></div>
      </form>
    </div>
  </section>

</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwESLMHq0qg9bz5glQX5zqCkOh5Fprpdpn1lpNNrdQwAobGQOlB8OW1GkETEx9j6Arf/exec";

/* ---------- Formateador de Fecha dd/mmm/aaaa ---------- */
function formatearFecha(fechaIso) {
  if (!fechaIso) return '';
  // Se asume formato YYYY-MM-DD
  const partes = fechaIso.split('-');
  if(partes.length !== 3) return fechaIso;
  
  // Usamos los números del string para evitar problemas de zona horaria (UTC vs Local)
  const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
  
  const opciones = { day: '2-digit', month: 'short', year: 'numeric' };
  // Genera algo como "26 sep 2026", luego reemplazamos espacios por "/"
  let formateada = fechaObj.toLocaleDateString('es-MX', opciones).replace(/\./g, ''); 
  // Convertimos "26 sep 2026" a "26/sep/2026"
  return formateada.split(' ').join('/');
}

/* ---------- navegación entre pestañas ---------- */
const tabHistorial = document.getElementById('tab-historial');
const tabFormulario = document.getElementById('tab-formulario');
const vistaHistorial = document.getElementById('vista-historial');
const vistaFormulario = document.getElementById('vista-formulario');

tabHistorial.addEventListener('click', () => cambiarVista('historial'));
tabFormulario.addEventListener('click', () => cambiarVista('formulario'));

function cambiarVista(nombre){
  const esHistorial = nombre === 'historial';
  tabHistorial.classList.toggle('active', esHistorial);
  tabFormulario.classList.toggle('active', !esHistorial);
  vistaHistorial.classList.toggle('activa', esHistorial);
  vistaFormulario.classList.toggle('activa', !esHistorial);
}

/* ---------- historial ---------- */
let pedidosCache = [];

async function cargarHistorial(){
  document.getElementById('resumen').textContent = 'Cargando pedidos…';
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error desconocido');
    pedidosCache = data.pedidos.filter(p => p.tipo_registro !== 'CARGO_ENVIO');
    renderTabla();
  }catch(err){
    document.getElementById('resumen').textContent = 'No se pudo cargar el historial: ' + err.message;
  }
}

function renderTabla(){
  const region = document.getElementById('f-region').value;
  const entrega = document.getElementById('f-entrega').value;
  const pago = document.getElementById('f-pago').value;
  const busqueda = document.getElementById('f-buscar').value.trim().toLowerCase();

  let filtrados = pedidosCache.filter(p => {
    if(region && p.region !== region) return false;
    if(entrega && p.status_entrega !== entrega) return false;
    if(pago && p.status_pago !== pago) return false;
    if(busqueda){
      const texto = [p.folio, p.guia, p.paqueteria, p.descripcion].join(' ').toLowerCase();
      if(!texto.includes(busqueda)) return false;
    }
    return true;
  });

  filtrados.sort((a,b) => Number(b.folio) - Number(a.folio));

  const pendEntrega = pedidosCache.filter(p => p.status_entrega === 'PENDIENTE');
  const pendPago = pedidosCache.filter(p => p.status_pago === 'PENDIENTE');
  const montoPendiente = pendPago.reduce((s,p) => s + (Number(p.monto) || 0), 0);
  document.getElementById('resumen').innerHTML =
    `Tienes <strong>${pendEntrega.length}</strong> pedidos por llegar y ` +
    `<strong>${pendPago.length}</strong> pendientes de pago ` +
    `(<strong>$${montoPendiente.toLocaleString('es-MX',{minimumFractionDigits:2})}</strong>).`;

  const tbody = document.getElementById('tabla-body');
  const vacio = document.getElementById('estado-vacio');
  tbody.innerHTML = '';

  if(filtrados.length === 0){
    vacio.style.display = 'block';
    return;
  }
  vacio.style.display = 'none';

  filtrados.forEach(p => {
    const tr = document.createElement('tr');
    tr.className = claseFila(p);

    const monto = Number(p.monto || 0).toLocaleString('es-MX', {minimumFractionDigits:2});
    const guiaTexto = p.guia || p.paqueteria || '—';
    const claseEstadoPago = p.status_pago === 'PAGADO' ? 'pago-pagado' : 'pago-pendiente';
    const textoEntrega = p.status_entrega === 'ENTREGADO' ? 'Entregado' : 'En camino';
    const textoPago = p.status_pago === 'PAGADO' ? 'Pagado' : 'Pendiente';
    
    // Aplicamos el formato dd/mmm/aaaa a la fecha que venga de la BD
    const fechaPagoFormateada = formatearFecha(p.fecha_pago);

    tr.innerHTML = `
      <td class="num">#${p.folio}</td>
      <td>${p.region || ''}</td>
      <td>${guiaTexto}</td>
      <td class="col-desc">${p.descripcion || ''}</td>
      <td class="num">${p.cantidad_kg || ''}</td>
      <td class="num"><strong>$${monto}</strong></td>
      <!-- Se añadieron las funciones onclick para cambiar los estatus con 1 clic -->
      <td>
        <span class="estado entrega interactivo" onclick="toggleEntrega('${p.folio}', '${p.status_entrega}')" title="Clic para cambiar estatus">
          ${textoEntrega}
        </span>
      </td>
      <td>
        <span class="estado ${claseEstadoPago} interactivo" onclick="togglePago('${p.folio}', '${p.status_pago}')" title="Clic para cambiar estatus">
          ${textoPago}
        </span>
      </td>
      <td class="num">${fechaPagoFormateada}</td>
    `;
    
    tbody.appendChild(tr);
  });
}

function claseFila(p){
  if(p.status_pago === 'PAGADO') return 'fila-pagado';
  if(p.status_entrega === 'ENTREGADO') return 'fila-entregado';
  return 'fila-en-camino';
}

function hoyISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- Funciones interactivas (Click) ---------- */
window.toggleEntrega = function(folio, estadoActual) {
  // Alterna entre PENDIENTE y ENTREGADO
  const nuevoEstado = estadoActual === 'ENTREGADO' ? 'PENDIENTE' : 'ENTREGADO';
  
  // Actualización optimista (cambia la interfaz inmediatamente antes de guardar para no hacer esperar al usuario)
  const pedido = pedidosCache.find(p => p.folio == folio);
  if(pedido) pedido.status_entrega = nuevoEstado;
  renderTabla(); 
  
  // Mandar actualización a Google Script
  actualizarPedido(folio, { status_entrega: nuevoEstado });
};

window.togglePago = function(folio, estadoActual) {
  // Alterna entre PENDIENTE y PAGADO
  const nuevoEstado = estadoActual === 'PAGADO' ? 'PENDIENTE' : 'PAGADO';
  
  // Si cambia a PAGADO, asume el día de hoy. Si cambia a PENDIENTE, borra la fecha.
  const nuevaFecha = nuevoEstado === 'PAGADO' ? hoyISO() : '';
  
  // Actualización optimista
  const pedido = pedidosCache.find(p => p.folio == folio);
  if(pedido) {
    pedido.status_pago = nuevoEstado;
    pedido.fecha_pago = nuevaFecha;
  }
  renderTabla();

  // Mandar actualización a Google Script
  actualizarPedido(folio, { status_pago: nuevoEstado, fecha_pago: nuevaFecha });
};

async function actualizarPedido(folio, cambios){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'actualizar', folio, cambios})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error desconocido');
    
    // Recargamos el historial desde cero de forma silenciosa para asegurar consistencia
    const resCache = await fetch(API_URL);
    const dataCache = await resCache.json();
    if(dataCache.ok){
      pedidosCache = dataCache.pedidos.filter(p => p.tipo_registro !== 'CARGO_ENVIO');
      renderTabla();
    }
  }catch(err){
    alert('No se pudo actualizar el pedido: ' + err.message);
  }
}

['f-region','f-entrega','f-pago'].forEach(id =>
  document.getElementById(id).addEventListener('change', renderTabla));
document.getElementById('f-buscar').addEventListener('input', renderTabla);
document.getElementById('btn-refrescar').addEventListener('click', cargarHistorial);

/* ---------- formulario ---------- */
document.getElementById('form-pedido').addEventListener('submit', async function(e){
  e.preventDefault();
  const mensaje = document.getElementById('mensaje-form');
  mensaje.className = '';
  mensaje.textContent = 'Guardando…';

  const pedido = {
    region: document.getElementById('f-in-region').value,
    cantidad_kg: parseFloat(document.getElementById('f-in-cantidad').value) || null,
    monto: parseFloat(document.getElementById('f-in-monto').value) || null,
    descripcion: document.getElementById('f-in-descripcion').value,
    guia: document.getElementById('f-in-guia').value,
    paqueteria: document.getElementById('f-in-paqueteria').value,
    tipo_registro: document.getElementById('f-in-cargo').checked ? 'CARGO_ENVIO' : 'PEDIDO'
  };

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'crear', pedido})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error desconocido');
    mensaje.className = 'ok';
    mensaje.textContent = `Guardado exitosamente con el folio #${data.folio}.`;
    this.reset();
    cargarHistorial();
  }catch(err){
    mensaje.className = 'error';
    mensaje.textContent = 'No se pudo guardar: ' + err.message;
  }
});

/* ---------- carga inicial ---------- */
cargarHistorial();
</script>
