<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Sierra Escondida - Control de Pedidos</title>
    <style>
        :root {
            --cafe-oscuro: #3b2818;
            --cafe-claro: #d4a373;
            --verde-acento: #588157;
            --fondo: #fefae0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--fondo); color: #333; margin: 0; padding: 20px; }
        h1, h2 { color: var(--cafe-oscuro); text-align: center; }
        .contenedor { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        .formulario { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #eee; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-guardar { background-color: var(--verde-acento); color: white; grid-column: 1 / -1; font-size: 16px; }
        .btn-guardar:hover { background-color: #3a5a39; }
        
        .filtros { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .btn-filtro { background-color: #eee; color: #333; }
        .btn-filtro.activo { background-color: var(--cafe-claro); color: white; }
        
        /* Contenedor responsivo para la tabla */
        .tabla-responsiva { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--cafe-oscuro); color: white; white-space: nowrap; }
        
        .btn-accion { font-size: 12px; padding: 5px 8px; margin: 2px; }
        .btn-pagar { background-color: #e07a5f; color: white; }
        .btn-llegar { background-color: #81b29a; color: white; }
        
        .estado-ok { font-weight: bold; color: var(--verde-acento); }
        .estado-pendiente { font-weight: bold; color: #e07a5f; }
        
        #loading { text-align: center; font-weight: bold; color: var(--cafe-oscuro); display: none; }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Control de Proveedores</h1>
    
    <!-- Sección de Registro -->
    <h2>Nuevo Pedido</h2>
    <form id="formPedido" class="formulario">
        <input type="text" id="guias" placeholder="No. de Guías">
        <select id="region" required>
            <option value="">Región...</option>
            <option value="Chiapas">Chiapas</option>
            <option value="Oaxaca">Oaxaca</option>
            <option value="Veracruz">Veracruz</option>
        </select>
        <input type="number" id="cantidad" placeholder="Cantidad (kg)" required>
        <input type="text" id="descripcion" placeholder="Descripción (Ej. Tueste Medio)" required>
        <input type="number" step="0.01" id="monto" placeholder="Monto Total ($)" required>
        <button type="submit" class="btn-guardar">Registrar Pedido</button>
    </form>

    <!-- Sección de Historial -->
    <h2>Historial de Pedidos</h2>
    <div class="filtros">
        <button class="btn-filtro activo" onclick="filtrar('todos')">Todos</button>
        <button class="btn-filtro" onclick="filtrar('pendientes_pago')">Falta Pagar</button>
        <button class="btn-filtro" onclick="filtrar('en_camino')">En Camino</button>
    </div>
    
    <div id="loading">Cargando base de datos...</div>
    
    <div class="tabla-responsiva">
        <table id="tablaPedidos">
            <thead>
                <tr>
                    <th>Guías</th>
                    <th>Región</th>
                    <th>Cant (kg)</th>
                    <th>Descripción</th>
                    <th>Monto</th>
                    <th>Entrega</th>
                    <th>Pago</th>
                    <th>Fecha de Pago</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <!-- Los datos se inyectarán aquí -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvnnXEn6bP2Xgd9SxTrkub2KQRxefbARhapajgj5LMeJjjpwH3zpBK_imsxNArlKY4/exec";
    
    let datosGlobales = [];

    async function cargarDatos() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('cuerpoTabla').innerHTML = '';
        
        try {
            const respuesta = await fetch(API_URL);
            datosGlobales = await respuesta.json();
            renderizarTabla(datosGlobales);
        } catch (error) {
            console.error("Error:", error);
            alert("Hubo un error al cargar los datos.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderizarTabla(datos) {
        const tbody = document.getElementById('cuerpoTabla');
        tbody.innerHTML = '';
        
        datos.forEach(fila => {
            const entrega = fila['STATUS DE ENTREGA'];
            const pago = fila['STATUS DE PAGO'];
            let fechaPagoText = fila['FECHA DE PAGO'] ? fila['FECHA DE PAGO'] : '---';

            if(fechaPagoText.includes('T')) {
                fechaPagoText = new Date(fechaPagoText).toLocaleDateString('es-MX');
            }
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${fila['GUIAS'] || '-'}</td>
                <td>${fila['REGION'] || '-'}</td>
                <td>${fila['CANTIDAD (KG)']}</td>
                <td>${fila['DESCRIPCION']}</td>
                <td>$${fila['MONTO']}</td>
                <td class="${entrega === 'Entregado' ? 'estado-ok' : 'estado-pendiente'}">${entrega}</td>
                <td class="${pago === 'Pagado' ? 'estado-ok' : 'estado-pendiente'}">${pago}</td>
                <td>${fechaPagoText}</td>
                <td>
                    ${pago !== 'Pagado' ? `<button class="btn-accion btn-pagar" onclick="actualizarFila(${fila.filaExcel}, 'pagar')">💰 Pagar</button>` : ''}
                    ${entrega !== 'Entregado' ? `<button class="btn-accion btn-llegar" onclick="actualizarFila(${fila.filaExcel}, 'llegar')">📦 Llegó</button>` : ''}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('formPedido').addEventListener('submit', async (e) => {
        e.preventDefault();
        const boton = e.target.querySelector('button');
        boton.innerText = "Guardando...";
        
        const nuevoPedido = {
            accion: "nuevo",
            guias: document.getElementById('guias').value,
            region: document.getElementById('region').value,
            cantidad: document.getElementById('cantidad').value,
            descripcion: document.getElementById('descripcion').value,
            monto: document.getElementById('monto').value
        };

        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(nuevoPedido)
        });
        
        e.target.reset();
        boton.innerText = "Registrar Pedido";
        cargarDatos(); 
    });

    async function actualizarFila(filaExcel, accion) {
        document.getElementById('loading').innerText = "Actualizando...";
        document.getElementById('loading').style.display = 'block';

        const payload = { accion: accion, filaExcel: filaExcel };

        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        document.getElementById('loading').innerText = "Cargando base de datos...";
        cargarDatos(); 
    }

    function filtrar(tipo) {
        document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo'));
        event.target.classList.add('activo');

        let filtrados = [];
        if (tipo === 'todos') {
            filtrados = datosGlobales;
        } else if (tipo === 'pendientes_pago') {
            filtrados = datosGlobales.filter(f => f['STATUS DE PAGO'] !== 'Pagado');
        } else if (tipo === 'en_camino') {
            filtrados = datosGlobales.filter(f => f['STATUS DE ENTREGA'] !== 'Entregado');
        }
        
        renderizarTabla(filtrados);
    }
    
    cargarDatos();
</script>

</body>
</html>
